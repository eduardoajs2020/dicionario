name: CI-CD Dicionario


on:

  push:

    branches:

      - main

      - master


  pull_request:

    branches:

      - main

      - master


env:

  IMAGE_NAME: dicionario


jobs:


  validate:

    runs-on: ubuntu-latest


    services:

      mysql:

        image: mysql:8.4

        env:

          MYSQL_ROOT_PASSWORD: root

          MYSQL_DATABASE: appdb

        ports:

          - 3306:3306


        options: >-

          --health-cmd="mysqladmin ping -h localhost -proot"

          --health-interval=10s

          --health-timeout=5s

          --health-retries=10


    steps:


      - name: Checkout

        uses: actions/checkout@v4


      - name: Setup PHP

        uses: shivammathur/setup-php@v2

        with:

          php-version: '8.3'


      - name: Validar sintaxe PHP

        run: |


          find . -name "*.php" -print0 |

          xargs -0 -n1 php -l


      - name: Instalar Cliente MySQL

        run: |


          sudo apt-get update

          sudo apt-get install -y mysql-client


      - name: Criar tabela dicionario

        run: |


          mysql -h 127.0.0.1 -uroot -proot appdb <<EOF


          CREATE TABLE IF NOT EXISTS dicionario(

              id INT AUTO_INCREMENT PRIMARY KEY,

              palavra VARCHAR(255) NOT NULL,

              significado TEXT NOT NULL

          );


          EOF


      - name: Validar estrutura

        run: |


          mysql -h 127.0.0.1 -uroot -proot appdb \

          -e "SHOW TABLES;"


  docker:


    runs-on: ubuntu-latest


    needs:

      - validate


    permissions:

      contents: read

      packages: write


    steps:


      - name: Checkout

        uses: actions/checkout@v4


      - name: Login GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Image

        run: |


          docker build \

          -t ghcr.io/${{ github.repository }}/dicionario:latest \

          .


      - name: Push Image

        run: |


          docker push \

          ghcr.io/${{ github.repository }}/dicionario:latest
 