name: ci-cd


on:

  push:

    branches:

      - main

      - master


  pull_request:

    branches:

      - main

      - master


  workflow_dispatch:


permissions:

  contents: read

  packages: write


jobs:

  validate:

    name: Validar PHP e banco MySQL

    runs-on: ubuntu-latest


    env:

      DB_HOST: 127.0.0.1

      DB_PORT: 3306


      DB_NAME: ${{ secrets.DB_NAME }}

      DB_USER: ${{ secrets.DB_USER }}

      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}


    services:

      mysql:

        image: mysql:8.0


        env:

          MYSQL_DATABASE: ${{ secrets.DB_NAME }}

          MYSQL_USER: ${{ secrets.DB_USER }}

          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}

          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}


        ports:

          - 3306:3306


        options: >-

          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"

          --health-interval=10s

          --health-timeout=5s

          --health-retries=20

          --health-start-period=30s


    steps:

      - name: Checkout do repositório

        uses: actions/checkout@v4


      - name: Validar configuração obrigatória

        shell: bash

        run: |

          set -euo pipefail


          variaveis=(

            DB_NAME

            DB_USER

            DB_PASSWORD

            MYSQL_ROOT_PASSWORD

          )


          for variavel in "${variaveis[@]}"; do

            if [ -z "${!variavel:-}" ]; then

              echo "::error::A variável ou secret $variavel não foi configurada."

              exit 1

            fi

          done


          echo "Secrets obrigatórios disponíveis."


      - name: Configurar PHP

        uses: shivammathur/setup-php@v2

        with:

          php-version: "8.3"

          extensions: pdo, pdo_mysql, mysqli

          coverage: none


      - name: Validar extensões PHP

        shell: bash

        run: |

          set -euo pipefail


          php --version

          php -m | grep -i '^PDO$'

          php -m | grep -i '^pdo_mysql$'

          php -m | grep -i '^mysqli$'


      - name: Validar sintaxe dos arquivos PHP

        shell: bash

        run: |

          set -euo pipefail


          encontrou_arquivo=false


          while IFS= read -r -d '' arquivo; do

            encontrou_arquivo=true

            echo "Validando $arquivo"

            php -l "$arquivo"

          done < <(

            find . \

              -type f \

              -name "*.php" \

              -not -path "./vendor/*" \

              -print0

          )


          if [ "$encontrou_arquivo" = false ]; then

            echo "::error::Nenhum arquivo PHP foi encontrado."

            exit 1

          fi


      - name: Instalar cliente MySQL

        shell: bash

        run: |

          set -euo pipefail


          sudo apt-get update

          sudo apt-get install -y default-mysql-client


      - name: Aguardar disponibilidade do MySQL

        shell: bash

        run: |

          set -euo pipefail


          for tentativa in $(seq 1 30); do

            if MYSQL_PWD="$MYSQL_ROOT_PASSWORD" \

              mysqladmin ping \

                --protocol=TCP \

                --host="$DB_HOST" \

                --port="$DB_PORT" \

                --user=root \

                --silent

            then

              echo "MySQL disponível."

              exit 0

            fi


            echo "Tentativa $tentativa de 30."

            sleep 2

          done


          echo "::error::O MySQL não ficou disponível."

          exit 1


      - name: Verificar arquivo de estrutura

        shell: bash

        run: |

          set -euo pipefail


          test -f database/schema.sql || {

            echo "::error::Arquivo database/schema.sql não encontrado."

            exit 1

          }


      - name: Aplicar estrutura do banco

        shell: bash

        run: |

          set -euo pipefail


          MYSQL_PWD="$DB_ROOT_PASSWORD" mysql \

            --protocol=TCP \

            --host="$DB_HOST" \

            --port="$DB_PORT" \

            --user=root \

            "$DB_NAME" \

            < database/schema.sql

        env:

          DB_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}


      - name: Aplicar dados iniciais opcionais

        if: ${{ hashFiles('database/seed.sql') != '' }}

        shell: bash

        run: |

          set -euo pipefail


          MYSQL_PWD="$DB_PASSWORD" mysql \

            --protocol=TCP \

            --host="$DB_HOST" \

            --port="$DB_PORT" \

            --user="$DB_USER" \

            "$DB_NAME" \

            < database/seed.sql


      - name: Validar conexão do usuário da aplicação

        shell: bash

        run: |

          set -euo pipefail


          MYSQL_PWD="$DB_PASSWORD" mysql \

            --protocol=TCP \

            --host="$DB_HOST" \

            --port="$DB_PORT" \

            --user="$DB_USER" \

            "$DB_NAME" \

            --execute="

              SELECT DATABASE() AS banco_atual;

              SHOW TABLES;

              DESCRIBE dicionario;

              SELECT COUNT(*) AS total_registros

              FROM dicionario;

            "


      - name: Executar teste real de conexão PDO

        shell: bash

        run: |

          set -euo pipefail


          php <<'PHP'

          <?php


          $variaveis = [

              'DB_HOST',

              'DB_PORT',

              'DB_NAME',

              'DB_USER',

              'DB_PASSWORD'

          ];


          foreach ($variaveis as $variavel) {

              if (getenv($variavel) === false || getenv($variavel) === '') {

                  fwrite(

                      STDERR,

                      "Variável ausente: {$variavel}" . PHP_EOL

                  );


                  exit(1);

              }

          }


          try {

              $dsn = sprintf(

                  'mysql:host=%s;port=%s;dbname=%s;charset=utf8mb4',

                  getenv('DB_HOST'),

                  getenv('DB_PORT'),

                  getenv('DB_NAME')

              );


              $conexao = new PDO(

                  $dsn,

                  getenv('DB_USER'),

                  getenv('DB_PASSWORD'),

                  [

                      PDO::ATTR_ERRMODE =>

                          PDO::ERRMODE_EXCEPTION,


                      PDO::ATTR_DEFAULT_FETCH_MODE =>

                          PDO::FETCH_ASSOC,


                      PDO::ATTR_EMULATE_PREPARES =>

                          false

                  ]

              );


              $consulta = $conexao->query(

                  'SELECT COUNT(*) AS total FROM dicionario'

              );


              $resultado = $consulta->fetch();


              echo 'Conexão PDO validada. Registros encontrados: '

                  . $resultado['total']

                  . PHP_EOL;

          } catch (Throwable $erro) {

              fwrite(

                  STDERR,

                  'Erro no teste PDO: '

                  . $erro->getMessage()

                  . PHP_EOL

              );


              exit(1);

          }

          PHP


  docker:

    name: Build e publicação da imagem

    runs-on: ubuntu-latest

    needs:

      - validate


    permissions:

      contents: read

      packages: write


    steps:

      - name: Checkout do repositório

        uses: actions/checkout@v4


      - name: Gerar nome da imagem

        shell: bash

        run: |

          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" \

            >> "$GITHUB_ENV"


      - name: Configurar Docker Buildx

        uses: docker/setup-buildx-action@v3


      - name: Autenticar no GHCR

        if: github.event_name == 'push'

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Gerar tags da imagem

        id: metadata

        uses: docker/metadata-action@v5

        with:

          images: ${{ env.IMAGE_NAME }}

          tags: |

            type=sha,prefix=sha-

            type=ref,event=branch

            type=ref,event=pr

            type=raw,value=latest,enable={{is_default_branch}}


      - name: Build e publicação

        uses: docker/build-push-action@v6

        with:

          context: .

          file: ./Dockerfile

          push: ${{ github.event_name == 'push' }}

          tags: ${{ steps.metadata.outputs.tags }}

          labels: ${{ steps.metadata.outputs.labels }}

          cache-from: type=gha

          cache-to: type=gha,mode=max
